name: Android Boot.img Kernel Analyzer

on:
  workflow_dispatch:
    inputs:
      boot_url:
        description: "Direct URL to boot.img"
        required: true
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Download boot.img
        run: |
          set -e

          echo "Downloading boot.img..."
          curl -L --fail --retry 3 \
            -o boot.img \
            "${{ inputs.boot_url }}"

          echo "Downloaded:"
          ls -lh boot.img

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            android-sdk-libsparse-utils \
            binutils \
            file \
            unzip \
            xz-utils \
            zstd \
            lz4

      - name: Install MagiskBoot
        run: |
          wget -q \
            https://github.com/topjohnwu/Magisk/releases/latest/download/Magisk.zip \
            -O Magisk.zip

          unzip -j Magisk.zip \
            "lib/x86_64/libmagiskboot.so" \
            -d magiskboot

          mv magiskboot/libmagiskboot.so magiskboot/magiskboot
          chmod +x magiskboot/magiskboot

      - name: Extract boot image
        run: |
          mkdir -p extracted

          ./magiskboot/magiskboot unpack boot.img

          echo "=== boot.img contents ==="
          ls -lah

          echo
          echo "=== Extracted kernel ==="

          if [ -f kernel ]; then
            cp kernel extracted/kernel
            ls -lh extracted/kernel
          else
            echo "ERROR: Kernel was not found!"
            exit 1
          fi

      - name: Analyze kernel
        run: |
          echo "========================================"
          echo "       ANDROID KERNEL ANALYZER"
          echo "========================================"

          echo
          echo "[1] Kernel file:"
          file extracted/kernel

          echo
          echo "[2] Kernel strings:"
          strings extracted/kernel | \
            grep -Ei \
            "Linux version|gcc version|clang version|Android" \
            | head -20 || true

          echo
          echo "[3] Linux Kernel version:"

          KERNEL_VERSION=$(strings extracted/kernel | \
            grep -m1 -E \
            "Linux version [0-9]+\.[0-9]+\.[0-9]+" \
            | sed

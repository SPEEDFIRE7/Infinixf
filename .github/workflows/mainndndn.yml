name: Android jKernel Analyzer

on:
  workflow_dispatch:
    inputs:
      boot_url:
        description: "Direct URL to boot.img"
        required: true
        type: string

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Android Kernel
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Download boot.img
      # ==========================================
      - name: Download boot.img
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "       ANDROID KERNEL ANALYZER"
          echo "========================================"
          echo

          URL="${{ inputs.boot_url }}"

          if [[ ! "$URL" =~ ^https?:// ]]; then
            echo "ERROR: Invalid URL"
            exit 1
          fi

          echo "Downloading boot.img..."

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 30 \
            --max-time 900 \
            -A "Android-Kernel-Analyzer" \
            "$URL" \
            -o boot.img

          echo
          echo "Download completed."
          echo

          ls -lh boot.img

          echo
          echo "File type:"
          file boot.img

          echo
          echo "SHA256:"
          sha256sum boot.img


      # ==========================================
      # Check existing tools
      # ==========================================
      - name: Check tools
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking required tools..."

          command -v curl
          command -v unzip
          command -v jq
          command -v file
          command -v strings
          command -v sha256sum

          echo
          echo "All required tools are already available."

          echo
          echo "Tool versions:"

          curl --version | head -1
          unzip -v | head -1
          jq --version
          file --version | head -1
          strings --version | head -1


      # ==========================================
      # Download Magisk
      # ==========================================
      - name: Download Magisk
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "          DOWNLOAD MAGISK"
          echo "========================================"

          mkdir -p tools

          echo "Querying official Magisk releases..."

          RELEASES=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -A "Android-Kernel-Analyzer" \
            https://api.github.com/repos/topjohnwu/Magisk/releases)

          echo "$RELEASES" > magisk-releases.json

          MAGISK_URL=$(echo "$RELEASES" | jq -r '
            [
              .[]
              | select(.draft == false)
              | select(.prerelease == false)
              | .assets[]
              | select(.name | test("^Magisk-v[0-9]+\\.[0-9]+\\.apk$"))
              | .browser_download_url
            ]
            | .[0]
          ')

          if [[ -z "$MAGISK_URL" || "$MAGISK_URL" == "null" ]]; then
            echo "ERROR: Could not find Magisk APK."
            exit 1
          fi

          echo
          echo "Magisk APK:"
          echo "$MAGISK_URL"

          echo
          echo "Downloading..."

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 30 \
            --max-time 600 \
            "$MAGISK_URL" \
            -o Magisk.apk

          echo
          echo "Magisk downloaded:"
          ls -lh Magisk.apk

          echo
          echo "Checking APK..."

          unzip -t Magisk.apk >/dev/null

          echo "APK is valid."


      # ==========================================
      # Extract MagiskBoot
      # ==========================================
      - name: Extract MagiskBoot
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "         EXTRACT MAGISKBOOT"
          echo "========================================"

          mkdir -p tools

          echo
          echo "Searching APK for magiskboot..."

          unzip -l Magisk.apk \
            | grep -E "lib/.*/libmagiskboot.so" \
            || true

          echo
          echo "Extracting x86_64 MagiskBoot..."

          unzip -j -o Magisk.apk \
            'lib/x86_64/libmagiskboot.so' \
            -d tools

          if [[ ! -f tools/libmagiskboot.so ]]; then
            echo
            echo "ERROR:"
            echo "libmagiskboot.so was not found."
            echo
            echo "Available Magisk libraries:"
            unzip -l Magisk.apk | grep "lib/" || true
            exit 1
          fi

          mv tools/libmagiskboot.so tools/magiskboot

          chmod +x tools/magiskboot

          echo
          echo "MagiskBoot installed."

          file tools/magiskboot

          echo
          echo "Testing MagiskBoot..."

          tools/magiskboot --help || true


      # ==========================================
      # Extract boot.img
      # ==========================================
      - name: Extract boot image
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "          EXTRACT BOOT IMAGE"
          echo "========================================"

          rm -rf extracted
          mkdir -p extracted

          cp boot.img extracted/original-boot.img

          cd extracted

          ../tools/magiskboot unpack original-boot.img

          echo
          echo "Extracted files:"
          ls -lah

          echo
          echo "Checking kernel..."

          if [[ ! -f kernel ]]; then
            echo
            echo "ERROR: Kernel was not extracted."
            echo
            echo "MagiskBoot output:"
            ls -lah
            exit 1
          fi

          echo
          echo "Kernel extracted successfully."

          ls -lh kernel

          echo
          echo "Kernel file type:"

          file kernel


      # ==========================================
      # Analyze Kernel
      # ==========================================
      - name: Analyze kernel
        shell: bash
        run: |
          set -euo pipefail

          KERNEL="extracted/kernel"

          echo
          echo "========================================"
          echo "       KERNEL INFORMATION"
          echo "========================================"

          echo
          echo "Kernel file:"
          file "$KERNEL"

          echo
          echo "Kernel SHA256:"
          sha256sum "$KERNEL"

          echo
          echo "----------------------------------------"
          echo "LINUX VERSION"
          echo "----------------------------------------"

          LINUX_VERSION=$(strings -a "$KERNEL" \
            | grep -m1 -E \
            'Linux version [0-9]+\.[0-9]+\.[0-9]+' \
            || true)

          if [[ -n "$LINUX_VERSION" ]]; then
            echo "$LINUX_VERSION"
          else
            echo "Not found"
          fi

          echo
          echo "----------------------------------------"
          echo "KERNEL VERSION"
          echo "----------------------------------------"

          VERSION=$(printf '%s\n' "$LINUX_VERSION" \
            | sed -nE \
            's/.*Linux version ([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/p')

          echo "${VERSION:-Unknown}"

          echo
          echo "----------------------------------------"
          echo "BUILD DATE"
          echo "----------------------------------------"

          BUILD_DATE=$(strings -a "$KERNEL" \
            | grep -E -m1 \
            '(Mon|Tue|Wed|Thu|Fri|Sat|Sun) (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) [ 0-9]{1,2} [0-9]{2}:[0-9]{2}:[0-9]{2} (UTC )?[0-9]{4}' \
            || true)

          echo "${BUILD_DATE:-Not found}"

          echo
          echo "----------------------------------------"
          echo "COMPILER"
          echo "----------------------------------------"

          COMPILER=$(strings -a "$KERNEL" \
            | grep -Ei \
            'clang version|gcc version|LLVM version' \
            | head -5 \
            || true)

          echo "${COMPILER:-Not found}"

          echo
          echo "----------------------------------------"
          echo "ARCHITECTURE"
          echo "----------------------------------------"

          file "$KERNEL"

          echo
          echo "----------------------------------------"
          echo "ANDROID / GKI"
          echo "----------------------------------------"

          GKI="Unknown"

          if strings -a "$KERNEL" \
            | grep -qiE \
            'android[0-9]+-[0-9]+|android[0-9]+-gki|GKI'; then

            GKI="Possible GKI"

          else

            GKI="Not detected"

          fi

          echo "$GKI"

          echo
          echo "----------------------------------------"
          echo "KERNELSU"
          echo "----------------------------------------"

          if strings -a "$KERNEL" \
            | grep -qiE \
            'KernelSU|kernelsu'; then

            echo "Possible KernelSU detected"

          else

            echo "Not detected"

          fi

          echo
          echo "----------------------------------------"
          echo "APATCH / KPM"
          echo "----------------------------------------"

          if strings -a "$KERNEL" \
            | grep -qiE \
            'APatch|apatch|KPM'; then

            echo "Possible APatch/KPM detected"

          else

            echo "Not detected"

          fi

          echo
          echo "========================================"


      # ==========================================
      # Generate report
      # ==========================================
      - name: Generate report
        shell: bash
        run: |
          set -euo pipefail

          KERNEL="extracted/kernel"
          REPORT="kernel-report.txt"

          LINUX_VERSION=$(strings -a "$KERNEL" \
            | grep -m1 -E \
            'Linux version [0-9]+\.[0-9]+\.[0-9]+' \
            || true)

          VERSION=$(printf '%s\n' "$LINUX_VERSION" \
            | sed -nE \
            's/.*Linux version ([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/p')

          BUILD_DATE=$(strings -a "$KERNEL" \
            | grep -E -m1 \
            '(Mon|Tue|Wed|Thu|Fri|Sat|Sun) (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) [ 0-9]{1,2} [0-9]{2}:[0-9]{2}:[0-9]{2} (UTC )?[0-9]{4}' \
            || true)

          COMPILER=$(strings -a "$KERNEL" \
            | grep -Ei \
            'clang version|gcc version|LLVM version' \
            | head -1 \
            || true)

          ARCH=$(file "$KERNEL")

          if strings -a "$KERNEL" \
            | grep -qiE \
            'android[0-9]+-[0-9]+|android[0-9]+-gki|GKI'; then
            GKI="Possible GKI"
          else
            GKI="Not detected"
          fi

          if strings -a "$KERNEL" \
            | grep -qiE 'KernelSU|kernelsu'; then
            KSU="Possible KernelSU"
          else
            KSU="Not detected"
          fi

          if strings -a "$KERNEL" \
            | grep -qiE 'APatch|apatch|KPM'; then
            APATCH="Possible APatch/KPM"
          else
            APATCH="Not detected"
          fi

          cat > "$REPORT" <<EOF
========================================
      ANDROID KERNEL ANALYSIS
========================================

KERNEL VERSION
----------------------------------------
${VERSION:-Unknown}

LINUX VERSION
----------------------------------------
${LINUX_VERSION:-Not found}

BUILD DATE
----------------------------------------
${BUILD_DATE:-Not found}

COMPILER
----------------------------------------
${COMPILER:-Not found}

ARCHITECTURE
----------------------------------------
$ARCH

GKI
----------------------------------------
$GKI

KERNELSU
----------------------------------------
$KSU

APATCH / KPM
----------------------------------------
$APATCH

KERNEL SHA256
----------------------------------------
$(sha256sum "$KERNEL" | awk '{print $1}')

BOOT SHA256
----------------------------------------
$(sha256sum boot.img | awk '{print $1}')

========================================
EOF

          cat "$REPORT"


      # ==========================================
      # GitHub Summary
      # ==========================================
      - name: GitHub Summary
        shell: bash
        run: |
          echo "# 🧠 Android Kernel Analyzer" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat kernel-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"


      # ==========================================
      # Upload kernel
      # ==========================================
      - name: Upload extracted kernel
        uses: actions/upload-artifact@v4
        with:
          name: extracted-kernel
          path: extracted/kernel


      # ==========================================
      # Upload extraction
      # ==========================================
      - name: Upload extracted boot
        uses: actions/upload-artifact@v4
        with:
          name: boot-extracted
          path: extracted/


      # ==========================================
      # Upload report
      # ==========================================
      - name: Upload kernel report
        uses: actions/upload-artifact@v4
        with:
          name: kernel-report
          path: kernel-report.txt

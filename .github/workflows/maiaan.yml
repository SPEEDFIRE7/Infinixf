          cat > app/src/main/java/com/dsulock/Shell.java <<'EOF'
          package com.dsulock;

          import android.content.Context;
          import android.content.pm.PackageManager;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.lang.reflect.Method;
          import rikka.shizuku.Shizuku;

          public class Shell {
              public static boolean useShizuku(Context c) {
                  return "shizuku".equals(c.getSharedPreferences("p", Context.MODE_PRIVATE).getString("method", "root"));
              }

              public static boolean shizukuReady() {
                  try {
                      return Shizuku.pingBinder() && Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED;
                  } catch (Throwable t) {
                      return false;
                  }
              }

              public static String run(Context c, String cmd) {
                  try {
                      Process p;
                      if (useShizuku(c)) {
                          if (!shizukuReady()) return c.getString(R.string.err_shizuku);
                          Method m = Shizuku.class.getDeclaredMethod("newProcess", String[].class, String[].class, String.class);
                          m.setAccessible(true);
                          p = (Process) m.invoke(null, new Object[]{new String[]{"sh", "-c", cmd + " 2>&1"}, null, null});
                      } else {
                          p = Runtime.getRuntime().exec(new String[]{"su", "-c", cmd + " 2>&1"});
                      }
                      BufferedReader r = new BufferedReader(new InputStreamReader(p.getInputStream()));
                      StringBuilder sb = new StringBuilder();
                      String l;
                      while ((l = r.readLine()) != null) sb.append(l).append('\n');
                      p.waitFor();
                      return sb.toString().trim();
                  } catch (Throwable e) {
                      return "Error: " + e;
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/dsulock/MainActivity.java <<'EOF'
          package com.dsulock;

          import android.content.Intent;
          import android.os.Bundle;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          import com.google.android.material.button.MaterialButton;
          import com.google.android.material.materialswitch.MaterialSwitch;

          public class MainActivity extends AppCompatActivity {
              private MaterialSwitch sw;
              private TextView summary, raw;
              private boolean updating = false;

              private void async(final String cmd) {
                  new Thread(() -> {
                      if (cmd != null) Shell.run(this, cmd);
                      final String st = Shell.run(this, "gsi_tool status");
                      runOnUiThread(() -> render(st));
                  }).start();
              }

              private void render(String st) {
                  String[] ls = st.split("\n");
                  boolean enabled = ls.length > 1 && ls[1].trim().equals("enabled");
                  updating = true;
                  sw.setChecked(enabled);
                  updating = false;
                  summary.setText(enabled ? R.string.state_on : R.string.state_off);
                  raw.setText(st);
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  setContentView(R.layout.activity_main);
                  sw = findViewById(R.id.sw);
                  summary = findViewById(R.id.summary);
                  raw = findViewById(R.id.raw);
                  MaterialButton st = findViewById(R.id.btnStatus);
                  MaterialButton rb = findViewById(R.id.btnReboot);
                  MaterialButton se = findViewById(R.id.btnSettings);

                  sw.setOnCheckedChangeListener((v, on) -> {
                      if (updating) return;
                      // enable = persistent (no -s); disable = next boot returns to the host ROM
                      async(on ? "gsi_tool enable" : "gsi_tool disable");
                  });
                  st.setOnClickListener(v -> async(null));
                  rb.setOnClickListener(v -> new Thread(() -> Shell.run(this, "svc power reboot || reboot")).start());
                  se.setOnClickListener(v -> startActivity(new Intent(this, SettingsActivity.class)));
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  async(null);
              }
          }
          EOF

          cat > app/src/main/java/com/dsulock/SettingsActivity.java <<'EOF'
          package com.dsulock;

          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.RadioGroup;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.appcompat.app.AppCompatDelegate;
          import androidx.core.os.LocaleListCompat;
          import com.google.android.material.button.MaterialButton;
          import com.google.android.material.dialog.MaterialAlertDialogBuilder;
          import rikka.shizuku.Shizuku;

          public class SettingsActivity extends AppCompatActivity {
              private static final String[] TAGS = {"", "ar", "en", "fr", "tr", "fa", "es"};
              private static final String[] NAMES = {null, "العربية", "English", "Français", "Türkçe", "فارسی", "Español"};

              private MaterialButton btnLang, btnGrant;
              private TextView shStatus;
              private RadioGroup rg;

              private final Shizuku.OnRequestPermissionResultListener permL =
                  (code, res) -> runOnUiThread(this::refresh);

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  setContentView(R.layout.activity_settings);
                  btnLang = findViewById(R.id.btnLang);
                  btnGrant = findViewById(R.id.btnGrant);
                  shStatus = findViewById(R.id.shStatus);
                  rg = findViewById(R.id.rg);

                  final SharedPreferences sp = getSharedPreferences("p", MODE_PRIVATE);
                  rg.check("shizuku".equals(sp.getString("method", "root")) ? R.id.rbShizuku : R.id.rbRoot);
                  rg.setOnCheckedChangeListener((g, id) -> {
                      sp.edit().putString("method", id == R.id.rbShizuku ? "shizuku" : "root").apply();
                      refresh();
                  });

                  btnLang.setOnClickListener(v -> pickLang());
                  btnGrant.setOnClickListener(v -> grant());

                  try { Shizuku.addRequestPermissionResultListener(permL); } catch (Throwable ignored) {}
              }

              @Override
              protected void onDestroy() {
                  try { Shizuku.removeRequestPermissionResultListener(permL); } catch (Throwable ignored) {}
                  super.onDestroy();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  refresh();
              }

              private int currentLangIndex() {
                  LocaleListCompat l = AppCompatDelegate.getApplicationLocales();
                  if (l.isEmpty() || l.get(0) == null) return 0;
                  String lang = l.get(0).getLanguage();
                  for (int i = 1; i < TAGS.length; i++) if (TAGS[i].equals(lang)) return i;
                  return 0;
              }

              private String langName(int i) {
                  return NAMES[i] == null ? getString(R.string.lang_system) : NAMES[i];
              }

              private void pickLang() {
                  String[] n = new String[NAMES.length];
                  for (int i = 0; i < n.length; i++) n[i] = langName(i);
                  new MaterialAlertDialogBuilder(this)
                      .setTitle(R.string.language)
                      .setSingleChoiceItems(n, currentLangIndex(), (d, w) -> {
                          d.dismiss();
                          AppCompatDelegate.setApplicationLocales(w == 0
                              ? LocaleListCompat.getEmptyLocaleList()
                              : LocaleListCompat.forLanguageTags(TAGS[w]));
                      })
                      .show();
              }

              private void grant() {
                  try {
                      if (!Shizuku.pingBinder()) { refresh(); return; }
                      if (Shizuku.shouldShowRequestPermissionRationale()) {
                          Toast.makeText(this, R.string.shizuku_denied_hint, Toast.LENGTH_LONG).show();
                      } else {
                          Shizuku.requestPermission(1);
                      }
                  } catch (Throwable ignored) {}
              }

              private void refresh() {
                  btnLang.setText(langName(currentLangIndex()));
                  boolean sz = rg.getCheckedRadioButtonId() == R.id.rbShizuku;
                  shStatus.setVisibility(sz ? View.VISIBLE : View.GONE);
                  btnGrant.setVisibility(View.GONE);
                  if (!sz) return;
                  boolean running = false;
                  try { running = Shizuku.pingBinder(); } catch (Throwable ignored) {}
                  if (!running) {
                      shStatus.setText(R.string.shizuku_notrunning);
                  } else if (Shell.shizukuReady()) {
                      shStatus.setText(R.string.shizuku_ok);
                  } else {
                      shStatus.setText(R.string.shizuku_nopermission);
                      btnGrant.setVisibility(View.VISIBLE);
                  }
              }
          }
          EOF

